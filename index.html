<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sohana ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Countdown -->
    <div id="countdown">
        <h1 id="count">3</h1>
    </div>

    <!-- Birthday Section -->
    <div id="birthday" class="hidden">

        <h1 class="title">
            🎉 Happy Birthday Sohana 🎉
        </h1>

        <!-- Cake -->
        <div class="cake">
            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="cake-top"></div>
            <div class="cake-body"></div>
        </div>

        <!-- Message -->
        <p id="typing"></p>

        <!-- Surprise Button -->
        <button id="surpriseBtn">
            🎁 Click Here
        </button>

        <!-- Surprise Text -->
        <div id="surprise" class="hidden">
            <h2>💖 You are truly special! 💖</h2>

            <p>
                May Allah bless your life with endless happiness,
                success, good health, and beautiful memories.
                Keep smiling always. 🌸
            </p>
        </div>

    </div>

    <!-- Effects -->
    <div id="balloons"></div>
    <div id="hearts"></div>
    <div id="confetti"></div>
    <audio id="birthdayMusic" loop>
    <source src="birthday-music.webm" type="audio/webm">
    Your browser does not support audio.
</audio>

<button id="musicBtn">🎵 Play Music</button>
  <script src="script.js"></script>

</body>
</html>
